replicaCount: 2
image:
  repository: REPLACE_WITH_ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/shopsphere
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: LoadBalancer
  port: 80
  targetPort: 8080
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
serviceMonitor:
  enabled: true
  interval: 30s
